<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Personalizá tu grabado</title>
<link href="https://fonts.googleapis.com/css2?family=DM+couriernew:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;width:100%}
body{background:#060606;color:#e8e0d0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;width:100%;position:relative}
header{
  padding:11px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid rgba(201,168,76,.1);
  background:#000;
  flex-wrap:wrap;
  gap:8px;
  position:sticky;
  top:0;
  z-index:100;
  position:relative;
}

.logo{
  font-size:14px;
  font-weight:500;
  letter-spacing:.28em;
  color:#c9a84c;
  text-transform:uppercase;
  position:absolute;
  left:18px;
}
.toolbar{display:flex;gap:5px;flex-wrap:wrap}
.btn{background:#000;border:1px solid rgba(255,255,255,.1);color:#a09080;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:rgba(201,168,76,.4);color:#d4c09a}
.btn.active{background:rgba(201,168,76,.14);border-color:#c9a84c;color:#c9a84c}
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 16px 8px;gap:12px}
.cw{position:relative;border-radius:2px;overflow:hidden;box-shadow:0 10px 70px #000,0 0 0 1px rgba(255,255,255,.03);max-width:820px;width:100%;cursor:crosshair}
@media(min-width:768px){.cw{max-width:580px}}
#pb{display:block;width:100%;height:auto;user-select:none;pointer-events:none;min-height:200px;background:#111}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#cg{mix-blend-mode:multiply}
#ch{mix-blend-mode:screen}
#tbox{position:absolute;display:none;border:1.5px dashed rgba(201,168,76,.6);pointer-events:none;box-sizing:border-box}
#tbox::before{content:'';position:absolute;top:-30px;left:calc(50% - .5px);width:1px;height:30px;background:rgba(201,168,76,.3);pointer-events:none}
.th{position:absolute;pointer-events:auto;z-index:25;touch-action:none}
#th-mv{inset:0;cursor:move}
.th-c{width:11px;height:11px;background:#000;border:1.5px solid #c9a84c;border-radius:2px}
#th-tl{top:-6px;left:-6px;cursor:nwse-resize}
#th-tr{top:-6px;right:-6px;cursor:nesw-resize}
#th-bl{bottom:-6px;left:-6px;cursor:nesw-resize}
#th-br{bottom:-6px;right:-6px;cursor:nwse-resize}
.th-r{width:24px;height:24px;top:-55px;left:calc(50% - 12px);cursor:grab;color:#c9a84c;font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(201,168,76,.45);border-radius:50%;background:#000}
#tinp{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:none;background:rgba(0,0,0,0.85);border:none;border-bottom:2px solid #c9a84c;color:#fff;caret-color:#c9a84c;font-weight:700;outline:none;width:80%;max-width:360px;padding:10px 12px;z-index:200;font-size:18px;letter-spacing:.02em;text-align:center;border-radius:4px 4px 0 0}
.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(232,224,208,.4)}
input[type=range]{-webkit-appearance:none;width:90px;height:2px;background:rgba(255,255,255,.14);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#c9a84c;cursor:pointer}
.val{color:#c9a84c;font-size:12px;min-width:18px;text-align:right}
#fpanel{display:none;max-width:820px;width:100%;background:#000;border:1px solid rgba(201,168,76,.1);border-radius:4px;padding:10px 12px;gap:6px;flex-wrap:wrap;align-items:center}
.flbl{font-size:10px;color:rgba(201,168,76,.35);letter-spacing:.12em;text-transform:uppercase;flex-shrink:0;margin-right:4px}
.fb{background:#000;border:1px solid rgba(255,255,255,.08);color:#a09080;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:16px;transition:all .12s;white-space:nowrap;line-height:1.3}
.fb:hover{border-color:rgba(201,168,76,.3);color:#d4c09a}
.fb.active{background:rgba(201,168,76,.14);border-color:#c9a84c;color:#c9a84c}
.strip{display:flex;gap:10px;padding:0 16px 16px;justify-content:center;flex-wrap:wrap}
.mat{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mat img{width:66px;height:44px;border-radius:2px;object-fit:cover;border:2px solid transparent;opacity:.45;transition:all .2s}
.mat img:hover{opacity:.8}
.mat img.active{border-color:#c9a84c;opacity:1;box-shadow:0 0 12px rgba(201,168,76,.25)}
.mname{font-size:10px;color:rgba(201,168,76,.3);letter-spacing:.08em;text-transform:uppercase}
.tip{font-size:11px;color:rgba(201,168,76,.22);text-align:center;padding:0 0 4px}
</style>
</head>
<body>
<header>
  <div class="logo">
  <img src="logo.pdf" alt="AMAYA">
  <span>Personalizá tu Grabado</span>
</div>
  <div class="logo">✦ Personalizá tu Grabado</div>
  <div class="toolbar">
    <button class="btn" id="btext" onclick="setTool('text')">T Texto</button>
    <button class="btn active" id="bdraw" onclick="setTool('draw')">✏ Dibujar</button>
    <button class="btn" id="berase" onclick="setTool('erase')">◻ Borrar</button>
    <button class="btn" onclick="undo()">↩ Deshacer</button>
    <button class="btn" onclick="clearAll()">✕ Limpiar</button>
    <button class="btn" id="bconfirm" onclick="confirmar()" style="display:none;border-color:#6a9;color:#6a9">✓ Confirmar</button>
    <button class="btn" id="bdown" onclick="downloadImg()">⬇ Guardar</button>
  </div>
</header>
<div class="main">
  <div class="cw" id="wrap">
    <img id="pb" alt="Superficie" crossorigin="anonymous">
    <canvas id="cg"></canvas>
    <canvas id="ch"></canvas>
    <div id="tbox">
      <div class="th" id="th-mv" data-handle="move"></div>
      <div class="th th-c" id="th-tl" data-handle="scale"></div>
      <div class="th th-c" id="th-tr" data-handle="scale"></div>
      <div class="th th-c" id="th-bl" data-handle="scale"></div>
      <div class="th th-c" id="th-br" data-handle="scale"></div>
      <div class="th th-r" id="th-rot" data-handle="rotate">↻</div>
    </div>
    </div>
  </div>
  <div id="fpanel"><span class="flbl">Tipografía</span></div>
  <div class="controls">
    <div class="ctrl" id="szc">
      <label>Grosor</label>
      <input type="range" id="sz" min="1" max="28" value="5" oninput="document.getElementById('szv').textContent=this.value">
      <span class="val" id="szv">5</span>
    </div>
    <div class="ctrl" id="fszc" style="display:none">
      <label>Tamaño</label>
      <input type="range" id="fsz" min="18" max="130" value="52" oninput="document.getElementById('fszv').textContent=this.value">
      <span class="val" id="fszv">52</span>
    </div>
  </div>
</div>
<input type="text" id="tinp" placeholder="Escribí el texto...">
<div class="strip" id="strip"></div>
<div class="tip" id="tip">Dibujá · al soltar podés mover, escalar y girar antes de grabar</div>

<script>
const MATS=[
  {name:"Granito",url:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=900&q=80&fit=crop"},
  {name:"Madera", url:"https://images.unsplash.com/photo-1541123437800-1bb1317badc2?w=900&q=80&fit=crop"},
  {name:"Mármol", url:"https://images.unsplash.com/photo-1557804506-669a67965ba0?w=900&q=80&fit=crop"},
  {name:"Metal",  url:"https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?w=900&q=80&fit=crop"},
  {name:"Arena",  url:"https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=900&q=80&fit=crop"},
  {name:"Cuero",  url:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900&q=80&fit=crop"},
];
const FONTS=[
  {label:"Calibri",           family:"'Calibri','Gill Sans',sans-serif"},
  {label:"Courier New",       family:"'Courier New',Courier,monospace"},
  {label:"Lucida Handwriting",family:"'Lucida Handwriting','Segoe Script',cursive"},
  {label:"Times New Roman",   family:"'Times New Roman',Times,serif"},
  {label:"Arial",             family:"Arial,Helvetica,sans-serif"},
];
const DEPTH=1.0;
let tool='draw', isDrawing=false, lx=0, ly=0, hist=[];
let curFont=FONTS[0];
let AO=null, bgG=null, bgH=null, drag=null, tPos={x:0,y:0};
let strokePts=[], tmpCG=null, tmpCH=null, suppressBlur=false;

const pb=document.getElementById('pb');
const cg=document.getElementById('cg'), ch=document.getElementById('ch');
const gc=cg.getContext('2d'), hc=ch.getContext('2d');
const tinp=document.getElementById('tinp');
const wrap=document.getElementById('wrap');
const tbox=document.getElementById('tbox');
const fpanel=document.getElementById('fpanel');

// Fonts
FONTS.forEach((f,i)=>{
  const b=document.createElement('button');
  b.className='fb'+(i===0?' active':'');
  b.style.fontFamily=f.family; b.textContent=f.label;
  b.onclick=()=>{curFont=f;document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));b.classList.add('active');tinp.style.fontFamily=f.family};
  fpanel.appendChild(b);
});

// Strip
MATS.forEach((m,i)=>{
  const d=document.createElement('div'); d.className='mat';
  const img=document.createElement('img');
  img.src=m.url; img.className=i===0?'active':''; img.crossOrigin='anonymous';
  img.onclick=()=>loadMat(i); img.onerror=()=>img.style.background=fb(i);
  const l=document.createElement('div'); l.className='mname'; l.textContent=m.name;
  d.appendChild(img); d.appendChild(l); document.getElementById('strip').appendChild(d);
});
function fb(i){return['#7a7875','#7a5c30','#b8b4b0','#8a9ca8','#c4ae78','#5c3d2a'][i]||'#555'}

function loadMat(idx){
  pb.src=MATS[idx].url; pb.onload=resizeC;
  pb.onerror=()=>{pb.style.minHeight='450px';pb.style.background=fb(idx);resizeC()};
  document.querySelectorAll('.mat img').forEach((img,j)=>img.classList.toggle('active',j===idx));
  clearAll(true);
}
function resizeC(){
  const w=pb.naturalWidth||820, h=pb.naturalHeight||540;
  cg.width=w; cg.height=h; ch.width=w; ch.height=h; hist=[];
}
loadMat(0);

function clientXY(e){
  if(e.touches&&e.touches.length) return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length) return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function cvPos(e){
  const r=cg.getBoundingClientRect(), sx=cg.width/r.width, sy=cg.height/r.height;
  const{x,y}=clientXY(e);
  return{x:(x-r.left)*sx, y:(y-r.top)*sy};
}

// History
function saveH(){hist.push({g:gc.getImageData(0,0,cg.width,cg.height),h:hc.getImageData(0,0,ch.width,ch.height)});if(hist.length>25)hist.shift()}
function undo(){if(AO){cancelAO();return}if(!hist.length)return;const s=hist.pop();gc.putImageData(s.g,0,0);hc.putImageData(s.h,0,0)}
function clearAll(silent){if(AO)cancelAO();if(!silent)saveH();gc.clearRect(0,0,cg.width,cg.height);hc.clearRect(0,0,ch.width,ch.height)}

// Drawing primitives
function getSz(){return parseInt(document.getElementById('sz').value)}
function eLine(x1,y1,x2,y2,ctx1,ctx2,s){
  s=s||getSz();
  ctx1.beginPath();ctx1.moveTo(x1,y1);ctx1.lineTo(x2,y2);ctx1.strokeStyle='rgba(0,0,0,1)';ctx1.lineWidth=s;ctx1.lineCap='round';ctx1.lineJoin='round';ctx1.stroke();
}
function erase(x,y){const r=getSz()*3.5;gc.clearRect(x-r/2,y-r/2,r,r);hc.clearRect(x-r/2,y-r/2,r,r)}

// === Active Object system ===
function renderAO(){
  if(!AO||!bgG)return;
  gc.putImageData(bgG,0,0); hc.putImageData(bgH,0,0);
  const a=AO, rad=a.rot*Math.PI/180;
  if(a.type==='text'){
    const f=a.fs*a.sc, font=`bold ${f}px ${a.ff}`;
    gc.save();gc.translate(a.cx,a.cy);gc.rotate(rad);gc.font=font;gc.textAlign='center';gc.textBaseline='middle';gc.fillStyle='rgba(0,0,0,1)';gc.fillText(a.tx,0,0);gc.restore();
  } else {
    const w=a.sw*a.sc, h=a.sh*a.sc;
    gc.save();gc.translate(a.cx,a.cy);gc.rotate(rad);gc.drawImage(tmpCG,-w/2,-h/2,w,h);gc.restore();
  }
}

function updateTbox(){
  if(!AO){tbox.style.display='none';return}
  const a=AO, r=cg.getBoundingClientRect(), sx=r.width/cg.width, sy=r.height/cg.height;
  let tw,th;
  if(a.type==='text'){
    const f=a.fs*a.sc;
    gc.font=`bold ${f}px ${a.ff}`;gc.textAlign='center';gc.textBaseline='middle';
    tw=gc.measureText(a.tx).width*sx; th=f*1.3*sy;
  } else {
    tw=a.sw*a.sc*sx; th=a.sh*a.sc*sy;
  }
  tbox.style.display='block';
  tbox.style.width=tw+'px'; tbox.style.height=th+'px';
  tbox.style.left=(a.cx*sx-tw/2)+'px'; tbox.style.top=(a.cy*sy-th/2)+'px';
  tbox.style.transform=`rotate(${a.rot}deg)`;
}

function showConfirm(v){document.getElementById('bconfirm').style.display=v?'inline-block':'none'}
function confirmar(){
  if(tinp.style.display==='block'){commitText();return}
  burnAO();
}
function commitText(){
  const tx=tinp.value.trim();
  suppressBlur=true; tinp.style.display='none'; tinp.value='';
  setTimeout(()=>suppressBlur=false,200);
  if(!tx)return;
  bgG=gc.getImageData(0,0,cg.width,cg.height); bgH=hc.getImageData(0,0,ch.width,ch.height);
  AO={type:'text',tx,ff:curFont.family,cx:tPos.x,cy:tPos.y,fs:parseInt(document.getElementById('fsz').value),sc:1,rot:0};
  renderAO(); updateTbox(); showConfirm(true);
}
function burnAO(){
  if(!AO)return;
  hist.push({g:bgG,h:bgH}); if(hist.length>25)hist.shift();
  AO=null; bgG=null; bgH=null; tbox.style.display='none'; showConfirm(false);
}
function cancelAO(){
  if(!AO)return;
  gc.putImageData(bgG,0,0); hc.putImageData(bgH,0,0);
  AO=null; bgG=null; bgH=null; tbox.style.display='none'; showConfirm(false);
}

// Tbox pointer drag
tbox.addEventListener('pointerdown',e=>{
  const h=e.target.dataset.handle; if(!h||!AO)return;
  e.preventDefault(); tbox.setPointerCapture(e.pointerId);
  const p=cvPos(e), a=AO;
  if(h==='move') drag={m:'mv',sx:p.x,sy:p.y,cx:a.cx,cy:a.cy};
  else if(h==='scale'){const d=Math.hypot(p.x-a.cx,p.y-a.cy)||1;drag={m:'sc',sd:d,ss:a.sc}}
  else if(h==='rotate') drag={m:'ro',sa:Math.atan2(p.y-a.cy,p.x-a.cx)*180/Math.PI,sr:a.rot};
});
tbox.addEventListener('pointermove',e=>{
  if(!drag||!AO)return; e.preventDefault();
  const p=cvPos(e), a=AO, d=drag;
  if(d.m==='mv'){a.cx=d.cx+(p.x-d.sx);a.cy=d.cy+(p.y-d.sy)}
  else if(d.m==='sc') a.sc=Math.max(0.05,d.ss*Math.hypot(p.x-a.cx,p.y-a.cy)/d.sd);
  else if(d.m==='ro') a.rot=d.sr+(Math.atan2(p.y-a.cy,p.x-a.cx)*180/Math.PI-d.sa);
  renderAO(); updateTbox();
});
tbox.addEventListener('pointerup',()=>drag=null);

// Capture drawing stroke into tmp canvases
function captureStroke(){
  if(!strokePts.length){bgG=null;bgH=null;return}
  const s=getSz(), pad=s+8;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  strokePts.forEach(p=>{x0=Math.min(x0,p.x-pad);y0=Math.min(y0,p.y-pad);x1=Math.max(x1,p.x+pad);y1=Math.max(y1,p.y+pad)});
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0));
  x1=Math.min(cg.width-1,Math.ceil(x1)); y1=Math.min(cg.height-1,Math.ceil(y1));
  const sw=x1-x0+1, sh=y1-y0+1;

  // Re-render stroke on fresh tmp canvases (offset to bounding box)
  tmpCG=document.createElement('canvas'); tmpCG.width=sw; tmpCG.height=sh;
  tmpCH=document.createElement('canvas'); tmpCH.width=sw; tmpCH.height=sh;
  const tg=tmpCG.getContext('2d'), th2=tmpCH.getContext('2d');

  if(strokePts.length===1){
    eLine(strokePts[0].x-x0,strokePts[0].y-y0,strokePts[0].x-x0,strokePts[0].y-y0,tg,th2,s);
  } else {
    for(let i=1;i<strokePts.length;i++){
      eLine(strokePts[i-1].x-x0,strokePts[i-1].y-y0,strokePts[i].x-x0,strokePts[i].y-y0,tg,th2,s);
    }
  }

  // Restore base state (remove the live stroke)
  gc.putImageData(bgG,0,0); hc.putImageData(bgH,0,0);

  // Create active drawing object
  AO={type:'draw', cx:x0+sw/2, cy:y0+sh/2, sw, sh, sc:1, rot:0};
  renderAO(); updateTbox(); showConfirm(true);
}

// Canvas events
function start(e){
  if(e.target&&e.target.dataset&&e.target.dataset.handle)return;
  e.preventDefault();
  if(tinp.style.display==='block')return;
  if(AO)return;
  if(tool==='text'){placeText(e);return}
  if(tool==='erase'){
    saveH(); isDrawing=true;
    const p=cvPos(e); lx=p.x;ly=p.y; erase(p.x,p.y); return;
  }
  // draw
  bgG=gc.getImageData(0,0,cg.width,cg.height);
  bgH=hc.getImageData(0,0,ch.width,ch.height);
  strokePts=[]; isDrawing=true;
  const p=cvPos(e); lx=p.x;ly=p.y;
  strokePts.push({x:p.x,y:p.y});
  eLine(p.x,p.y,p.x,p.y,gc,hc);
}
function move(e){
  e.preventDefault(); if(!isDrawing)return;
  const p=cvPos(e);
  if(tool==='erase') erase(p.x,p.y);
  else{eLine(lx,ly,p.x,p.y,gc,hc);strokePts.push({x:p.x,y:p.y})}
  lx=p.x;ly=p.y;
}
function stop(){
  if(!isDrawing)return; isDrawing=false;
  if(tool==='draw'&&bgG) captureStroke();
}
wrap.addEventListener('mousedown',start);
wrap.addEventListener('mousemove',move);
wrap.addEventListener('mouseup',stop);
wrap.addEventListener('mouseleave',stop);
wrap.addEventListener('touchstart',start,{passive:false});
wrap.addEventListener('touchmove',move,{passive:false});
wrap.addEventListener('touchend',stop);

// Text input
function placeText(e){
  const r=cg.getBoundingClientRect(), {x,y}=clientXY(e);
  tPos.x=(x-r.left)*(cg.width/r.width); tPos.y=(y-r.top)*(cg.height/r.height);
  tinp.style.display='block';
  tinp.style.fontFamily=curFont.family;
  tinp.value=''; suppressBlur=false; tinp.focus();
}
tinp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();e.stopPropagation();commitText()}
  else if(e.key==='Escape'){e.stopPropagation();suppressBlur=true;tinp.style.display='none';tinp.value='';showConfirm(false);setTimeout(()=>suppressBlur=false,200)}
});
tinp.addEventListener('blur',()=>{});

// Tool switching
function setTool(t){
  tool=t;
  ['draw','text','erase'].forEach(n=>document.getElementById('b'+n).classList.toggle('active',n===t));
  const isTxt=t==='text';
  fpanel.style.display=isTxt?'flex':'none';
  document.getElementById('fszc').style.display=isTxt?'flex':'none';
  document.getElementById('szc').style.display=isTxt?'none':'flex';
  wrap.style.cursor=t==='erase'?'cell':t==='text'?'text':'crosshair';
  document.getElementById('tip').textContent={
    draw:'Al soltar el trazo podés moverlo, escalarlo y girarlo · siguiente trazo lo confirma',
    text:'Clic para escribir · Enter confirma · handles: mover / esquinas: escalar / ↻: girar',
    erase:'Arrastrá para borrar'
  }[t];
}

// Keys
document.addEventListener('keydown',e=>{
  if(tinp.style.display==='block')return;
  if(AO&&e.key==='Escape'){cancelAO();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
});

// Download
function downloadImg(){
  if(AO)burnAO();
  const btn=document.getElementById('bdown'); btn.textContent='⏳...'; btn.disabled=true;
  const tmp=document.createElement('canvas'); tmp.width=cg.width; tmp.height=cg.height;
  const ctx=tmp.getContext('2d');
  try{
    ctx.drawImage(pb,0,0,cg.width,cg.height);
    ctx.globalCompositeOperation='multiply'; ctx.drawImage(cg,0,0);
    ctx.globalCompositeOperation='screen'; ctx.drawImage(ch,0,0);
    const a=document.createElement('a'); a.download='grabado.png'; a.href=tmp.toDataURL('image/png'); a.click();
  }catch(err){alert('No se pudo exportar. Las fotos deben estar en el mismo repo de GitHub.')}
  btn.textContent='⬇ Guardar'; btn.disabled=false;
}
</script>
